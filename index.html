<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will Wu · 健身內容寫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black: #111110;
  --gray-dark: #3a3935;
  --gray-mid: #6b6860;
  --gray-light: #a8a59f;
  --gray-rule: #e4e1da;
  --bg: #ffffff;
  --bg-tint: #f9f8f6;
  --accent: #1a1a1a;
  --tag-bg: #f2f0eb;
  --tag-color: #5a5750;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--black);
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 300;
  font-size: 16px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}

/* ── LAYOUT ── */
.container { max-width: 680px; margin: 0 auto; padding: 0 24px; }

/* ── NAV ── */
header {
  border-bottom: 1px solid var(--gray-rule);
  position: sticky; top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 50;
}
.header-inner {
  max-width: 680px; margin: 0 auto; padding: 0 24px;
  height: 56px;
  display: flex; align-items: center; justify-content: space-between;
}
.site-name {
  font-family: 'Noto Serif TC', serif;
  font-size: 15px; font-weight: 600;
  color: var(--black); text-decoration: none;
  letter-spacing: 0.02em;
}
.header-contact {
  font-size: 13px; color: var(--gray-mid);
  text-decoration: none;
  border-bottom: 1px solid var(--gray-rule);
  transition: color 0.15s, border-color 0.15s;
}
.header-contact:hover { color: var(--black); border-color: var(--black); }

/* ── HERO ── */
.hero { padding: 72px 0 56px; border-bottom: 1px solid var(--gray-rule); }
.hero-label {
  font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--gray-light);
  margin-bottom: 20px;
}
.hero h1 {
  font-family: 'Noto Serif TC', serif;
  font-size: clamp(28px, 5vw, 38px);
  font-weight: 300; line-height: 1.4;
  color: var(--black); margin-bottom: 20px;
}
.hero-bio {
  font-size: 15px; color: var(--gray-dark);
  line-height: 1.9; max-width: 520px;
  margin-bottom: 28px;
}
.hero-tags { display: flex; gap: 8px; flex-wrap: wrap; }
.hero-tag {
  font-size: 12px; color: var(--tag-color);
  background: var(--tag-bg);
  padding: 4px 12px; border-radius: 2px;
  letter-spacing: 0.04em;
}

/* ── FILTER ── */
.filter-bar {
  padding: 28px 0 0;
  display: flex; gap: 6px; flex-wrap: wrap;
}
.filter-btn {
  font-size: 13px; font-family: 'Noto Sans TC', sans-serif;
  color: var(--gray-mid); background: none;
  border: 1px solid var(--gray-rule);
  padding: 5px 14px; border-radius: 2px;
  cursor: pointer; transition: all 0.15s;
}
.filter-btn:hover { color: var(--black); border-color: #ccc; }
.filter-btn.active {
  color: var(--black); background: var(--black);
  color: #fff; border-color: var(--black);
}

/* ── ARTICLE LIST ── */
.article-list { padding: 8px 0 80px; }
.article-item {
  padding: 36px 0;
  border-bottom: 1px solid var(--gray-rule);
  display: grid;
  grid-template-columns: 1fr 80px;
  gap: 16px; align-items: start;
  cursor: pointer; transition: opacity 0.15s;
  text-decoration: none; color: inherit;
}
.article-item:hover { opacity: 0.7; }
.article-item:first-child { border-top: 1px solid var(--gray-rule); margin-top: 20px; }
.article-type {
  font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--gray-light);
  margin-bottom: 10px;
}
.article-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 20px; font-weight: 400; line-height: 1.5;
  color: var(--black); margin-bottom: 10px;
}
.article-summary {
  font-size: 14px; color: var(--gray-mid);
  line-height: 1.8;
}
.article-meta {
  text-align: right;
  font-size: 12px; color: var(--gray-light);
  line-height: 1.7; padding-top: 4px;
}

/* ── ARTICLE DETAIL ── */
.article-detail { display: none; padding: 56px 0 80px; }
.back-btn {
  font-size: 13px; color: var(--gray-mid);
  background: none; border: none; cursor: pointer;
  padding: 0; margin-bottom: 40px;
  display: flex; align-items: center; gap: 6px;
  transition: color 0.15s;
}
.back-btn:hover { color: var(--black); }
.detail-type {
  font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--gray-light);
  margin-bottom: 16px;
}
.detail-title {
  font-family: 'Noto Serif TC', serif;
  font-size: clamp(24px, 4vw, 32px);
  font-weight: 300; line-height: 1.4;
  color: var(--black); margin-bottom: 12px;
}
.detail-client {
  font-size: 13px; color: var(--gray-light);
  margin-bottom: 40px;
  padding-bottom: 32px;
  border-bottom: 1px solid var(--gray-rule);
}

/* Article body */
.prose { font-size: 16px; color: var(--gray-dark); line-height: 1.9; }
.prose p { margin-bottom: 20px; }
.prose-heading {
  display: flex; align-items: baseline; gap: 14px;
  margin: 40px 0 14px;
}
.prose-heading-num {
  font-family: 'Noto Serif TC', serif;
  font-size: 11px; color: var(--gray-light);
  letter-spacing: 0.1em; flex-shrink: 0;
}
.prose-heading-text {
  font-family: 'Noto Serif TC', serif;
  font-size: 17px; font-weight: 600;
  color: var(--black); line-height: 1.5;
}
.prose-callout {
  border-left: 2px solid var(--gray-rule);
  padding: 14px 20px;
  margin: 28px 0;
  font-size: 14px; color: var(--gray-mid);
  line-height: 1.8;
}

/* IG Posts */
.ig-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: var(--gray-rule); margin: 0 -1px; }
@media(max-width:560px){ .ig-grid { grid-template-columns: 1fr; } }
.ig-card {
  background: var(--bg); padding: 28px 24px;
  aspect-ratio: 4/5; display: flex; flex-direction: column;
  justify-content: space-between;
}
.ig-card-tag {
  font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--gray-light);
  margin-bottom: 8px;
}
.ig-card-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 15px; font-weight: 600;
  line-height: 1.6; color: var(--black);
  flex: 1; padding: 8px 0;
}
.ig-card-body {
  font-size: 13px; color: var(--gray-mid);
  line-height: 1.8; white-space: pre-line;
  margin-bottom: 12px;
}
.ig-card-hash { font-size: 12px; color: var(--gray-light); }

/* Sales page */
.sales-wrap { border: 1px solid var(--gray-rule); border-radius: 2px; overflow: hidden; }
.sales-top { padding: 36px 32px 28px; border-bottom: 1px solid var(--gray-rule); }
.sales-badge {
  display: inline-block; font-size: 11px;
  letter-spacing: 0.12em; text-transform: uppercase;
  border: 1px solid var(--black); color: var(--black);
  padding: 3px 10px; margin-bottom: 20px;
}
.sales-headline {
  font-family: 'Noto Serif TC', serif;
  font-size: clamp(18px, 3vw, 22px);
  font-weight: 300; line-height: 1.5;
  color: var(--black); margin-bottom: 12px;
}
.sales-sub { font-size: 14px; color: var(--gray-mid); line-height: 1.8; max-width: 460px; }
.sales-body { padding: 28px 32px; }
.sales-section-label {
  font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--gray-light);
  margin-bottom: 16px;
}
.pain-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 32px; }
@media(max-width:460px){ .pain-grid { grid-template-columns: 1fr; } }
.pain-item {
  font-size: 13px; color: var(--gray-mid);
  padding: 12px 14px;
  border: 1px solid var(--gray-rule);
  line-height: 1.6;
}
.plan-row {
  display: flex; justify-content: space-between;
  align-items: center; flex-wrap: wrap; gap: 10px;
  padding: 18px 0; border-bottom: 1px solid var(--gray-rule);
}
.plan-row:last-child { border-bottom: none; }
.plan-row.featured .plan-name { font-weight: 500; }
.plan-name {
  font-family: 'Noto Serif TC', serif;
  font-size: 15px; color: var(--black); margin-bottom: 4px;
}
.plan-badge {
  display: inline-block; font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--gray-mid); border: 1px solid var(--gray-rule);
  padding: 1px 7px; margin-left: 8px; vertical-align: middle;
}
.plan-perks { font-size: 12px; color: var(--gray-light); line-height: 1.7; }
.plan-price-wrap { text-align: right; }
.plan-price-amt {
  font-family: 'Noto Serif TC', serif;
  font-size: 22px; color: var(--black);
}
.plan-price-period { font-size: 12px; color: var(--gray-light); display: block; }
.sales-cta-wrap {
  text-align: center; padding: 24px 32px 28px;
  border-top: 1px solid var(--gray-rule);
}
.sales-cta-btn {
  display: inline-block; background: var(--black); color: #fff;
  font-family: 'Noto Sans TC', sans-serif; font-size: 14px;
  padding: 12px 32px; text-decoration: none; letter-spacing: 0.04em;
  transition: opacity 0.15s;
}
.sales-cta-btn:hover { opacity: 0.75; }
.sales-cta-sub { font-size: 12px; color: var(--gray-light); margin-top: 10px; }

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--gray-rule);
  padding: 28px 0;
}
.footer-inner {
  max-width: 680px; margin: 0 auto; padding: 0 24px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 8px;
}
.footer-name { font-size: 13px; color: var(--gray-light); }
.footer-link { font-size: 13px; color: var(--gray-mid); text-decoration: none; border-bottom: 1px solid var(--gray-rule); }
.footer-link:hover { color: var(--black); }

/* ── LOADING ── */
.loading { padding: 60px 0; text-align: center; font-size: 14px; color: var(--gray-light); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="site-name" href="#" onclick="showList(); return false;">Will Wu</a>
    <a class="header-contact" href="mailto:willwu@email.com">聯絡合作</a>
  </div>
</header>

<main class="container">

  <!-- LIST VIEW -->
  <div id="list-view">
    <section class="hero">
      <div class="hero-label">健身內容寫手 · Fitness Content Writer</div>
      <h1>讓健身專業<br>變成客戶看得懂的內容</h1>
      <p class="hero-bio">五年健身房銷售資歷，熟悉台灣健身市場的消費心態與銷售邏輯。擅長把產業知識轉化成讓讀者採取行動的文字，服務範圍涵蓋 SEO 長文、社群系列貼文、品牌銷售頁。</p>
      <div class="hero-tags">
        <span class="hero-tag">SEO 內容</span>
        <span class="hero-tag">社群文案</span>
        <span class="hero-tag">銷售文案</span>
        <span class="hero-tag">健身 / 運動產業</span>
      </div>
    </section>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all" onclick="filterArticles('all', this)">全部</button>
      <button class="filter-btn" data-filter="long-form" onclick="filterArticles('long-form', this)">長文寫作</button>
      <button class="filter-btn" data-filter="social" onclick="filterArticles('social', this)">社群文案</button>
      <button class="filter-btn" data-filter="copywriting" onclick="filterArticles('copywriting', this)">銷售文案</button>
    </div>

    <div class="article-list" id="article-list">
      <div class="loading">載入中…</div>
    </div>
  </div>

  <!-- DETAIL VIEW -->
  <div id="detail-view" class="article-detail">
    <button class="back-btn" onclick="showList()">← 返回作品列表</button>
    <div id="detail-content"></div>
  </div>

</main>

<footer>
  <div class="footer-inner">
    <span class="footer-name">© Will Wu</span>
    <a class="footer-link" href="mailto:willwu@email.com">willwu@email.com</a>
  </div>
</footer>

<script>
// ── CONFIG ──
// 部署後請將這個網址改成你的 GitHub raw 連結
// 格式：https://raw.githubusercontent.com/你的帳號/portfolio/main/articles.json
const ARTICLES_URL = './articles.json';

let allArticles = [];
let currentFilter = 'all';

// ── FETCH ──
async function loadArticles() {
  try {
    const res = await fetch(ARTICLES_URL + '?v=' + Date.now());
    allArticles = await res.json();
    renderList(allArticles);
  } catch(e) {
    document.getElementById('article-list').innerHTML =
      '<div class="loading">載入失敗，請確認 articles.json 路徑正確。</div>';
  }
}

// ── RENDER LIST ──
function renderList(articles) {
  const el = document.getElementById('article-list');
  const filtered = currentFilter === 'all'
    ? articles
    : articles.filter(a => a.type === currentFilter);

  if (!filtered.length) {
    el.innerHTML = '<div class="loading" style="padding:40px 0">此分類暫無作品</div>';
    return;
  }

  el.innerHTML = filtered.map(a => `
    <a class="article-item" href="#${a.id}" onclick="showDetail('${a.id}'); return false;">
      <div>
        <div class="article-type">${a.typeLabel}</div>
        <div class="article-title">${a.title}</div>
        <div class="article-summary">${a.summary}</div>
      </div>
      <div class="article-meta">
        ${a.date}<br>${a.client}
      </div>
    </a>
  `).join('');
}

// ── FILTER ──
function filterArticles(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList(allArticles);
}

// ── SHOW DETAIL ──
function showDetail(id) {
  const a = allArticles.find(x => x.id === id);
  if (!a) return;

  document.getElementById('list-view').style.display = 'none';
  const detail = document.getElementById('detail-view');
  detail.style.display = 'block';

  let html = `
    <div class="detail-type">${a.typeLabel}</div>
    <h2 class="detail-title">${a.title}</h2>
    <div class="detail-client">客戶：${a.client} · ${a.date}</div>
  `;

  if (a.type === 'long-form') {
    html += `<div class="prose">${renderProse(a.content)}</div>`;
  } else if (a.type === 'social') {
    html += renderIGPosts(a.posts);
  } else if (a.type === 'copywriting') {
    html += renderSalesPage(a.salesPage);
  }

  document.getElementById('detail-content').innerHTML = html;
  window.scrollTo(0, 0);
}

// ── SHOW LIST ──
function showList() {
  document.getElementById('list-view').style.display = 'block';
  document.getElementById('detail-view').style.display = 'none';
  window.scrollTo(0, 0);
}

// ── PROSE RENDERER ──
function renderProse(blocks) {
  return blocks.map(b => {
    if (b.type === 'paragraph') return `<p>${b.text}</p>`;
    if (b.type === 'heading') return `
      <div class="prose-heading">
        <span class="prose-heading-num">${b.number}</span>
        <span class="prose-heading-text">${b.text}</span>
      </div>`;
    if (b.type === 'callout') return `
      <div class="prose-callout">${b.text}</div>`;
    return '';
  }).join('');
}

// ── IG RENDERER ──
function renderIGPosts(posts) {
  const cards = posts.map(p => `
    <div class="ig-card">
      <div>
        <div class="ig-card-tag">${p.tag}</div>
        <div class="ig-card-title">${p.title}</div>
      </div>
      <div>
        <div class="ig-card-body">${p.body}</div>
        <div class="ig-card-hash">${p.hashtags}</div>
      </div>
    </div>
  `).join('');
  return `<div class="ig-grid">${cards}</div>`;
}

// ── SALES PAGE RENDERER ──
function renderSalesPage(s) {
  const pains = s.painPoints.map(p =>
    `<div class="pain-item">${p}</div>`).join('');

  const plans = s.plans.map(p => `
    <div class="plan-row${p.featured ? ' featured' : ''}">
      <div>
        <div class="plan-name">${p.name}${p.badge ? `<span class="plan-badge">${p.badge}</span>` : ''}</div>
        <div class="plan-perks">${p.perks}</div>
      </div>
      <div class="plan-price-wrap">
        <span class="plan-price-amt">${p.price}</span>
        <span class="plan-price-period">${p.period}</span>
      </div>
    </div>
  `).join('');

  return `
    <div class="sales-wrap">
      <div class="sales-top">
        <div class="sales-badge">${s.badge}</div>
        <div class="sales-headline">${s.headline}</div>
        <div class="sales-sub">${s.subheadline}</div>
      </div>
      <div class="sales-body">
        <div class="sales-section-label">你可能有這些困擾</div>
        <div class="pain-grid">${pains}</div>
        <div class="sales-section-label">選擇你的方案</div>
        ${plans}
      </div>
      <div class="sales-cta-wrap">
        <a class="sales-cta-btn" href="#">${s.cta}</a>
        <div class="sales-cta-sub">${s.ctaSub}</div>
      </div>
    </div>`;
}

// ── INIT ──
loadArticles();
</script>

</body>
</html>
